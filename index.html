<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>潮汐的守望 4.2 — 四季之约</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

  :root {
    --sea-50: #f0f8fa; --sea-100: #e0f0f5; --sea-200: #c0e0eb;
    --sea-300: #90c8d8; --sea-400: #5faec4; --sea-500: #3a8fa8;
    --sea-600: #2c6f85; --sea-700: #1f5263;
    --coral-100: #ffe8e0; --coral-300: #ffb5a0; --coral-500: #f58568;
    --sand-100: #fff6e8; --sand-200: #ffe9c4; --sand-300: #f5d89a;
    --gold: #e5b96a; --gold-dark: #b88a3d;
    --ink: #1f3a44; --ink-soft: #5a7a85;
    --mint: #a8d8c9; --lavender: #c9b8e0;
    --pink: #f5c6d8; --pink-dark: #c98aa8;
    --green: #7ab89a;
    /* 四季色 */
    --spring: linear-gradient(135deg, #f0f8e8, #fce8e8);
    --summer: linear-gradient(135deg, #e0f4f8, #fef4c8);
    --autumn: linear-gradient(135deg, #fce8d8, #f5e8c8);
    --winter: linear-gradient(135deg, #e8f0f8, #f8fcff);
  }

  body {
    background: linear-gradient(160deg, #eaf5f8 0%, #f5f0e8 100%);
    background-image:
      radial-gradient(circle at 12% 18%, #d9eef5 0%, transparent 45%),
      radial-gradient(circle at 88% 82%, #fde8dd 0%, transparent 50%),
      linear-gradient(180deg, #f0f8fa 0%, #fdf5ec 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 10px; margin: 0; overflow-x: hidden;
  }

  .app-container {
    max-width: 820px; width: 100%;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 44px;
    box-shadow: 0 40px 80px -20px rgba(60, 110, 130, 0.25),
                0 20px 40px -20px rgba(60, 110, 130, 0.15),
                inset 0 0 0 1.5px rgba(255, 255, 255, 0.9);
    padding: 22px 20px 24px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    position: relative;
  }

  /* 顶部栏 */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
    gap: 8px; flex-wrap: wrap;
  }
  .game-title {
    font-size: 1.3rem; font-weight: 800;
    background: linear-gradient(135deg, var(--sea-700), var(--sea-400));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    letter-spacing: -0.5px; display: flex; align-items: center; gap: 7px;
  }
  .game-title .ver {
    font-size: 0.6rem; background: linear-gradient(135deg, var(--coral-500), var(--coral-300));
    color: #fff; padding: 3px 9px; border-radius: 40px;
    -webkit-text-fill-color: #fff; font-weight: 600; letter-spacing: 0.5px;
    box-shadow: 0 3px 8px rgba(240, 120, 100, 0.3);
  }
  .top-right-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .progress-badge {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #fff5fb, #ffe8dd);
    padding: 6px 14px 6px 10px; border-radius: 60px;
    border: 1.5px solid var(--coral-300);
    box-shadow: 0 4px 12px -4px rgba(240, 140, 110, 0.3);
    font-weight: 700; font-size: 0.78rem; color: var(--coral-500);
  }
  .progress-badge .icon { font-size: 1.05rem; }
  .progress-badge .main { line-height: 1.1; }
  .progress-badge .sub { font-size: 0.58rem; color: #d08070; font-weight: 500; }

  .icon-btn {
    background: rgba(255, 255, 255, 0.9);
    border: 1.5px solid var(--sea-200);
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 1.1rem; cursor: pointer; color: var(--sea-600);
    line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit;
    box-shadow: 0 3px 8px -3px rgba(60, 110, 130, 0.3);
    position: relative;
  }
  .icon-btn:hover { background: var(--sea-100); transform: translateY(-1px); }
  .icon-btn .mini-badge {
    position: absolute; top: -3px; right: -3px;
    background: var(--coral-500); color: #fff;
    font-size: 0.5rem; font-weight: 800;
    min-width: 14px; height: 14px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
  }

  /* 女儿舞台 */
  .daughter-stage {
    position: relative;
    background: linear-gradient(180deg, #e8f4f8 0%, #fdf0e5 60%, #fce4d6 100%);
    border-radius: 32px; padding: 18px 18px 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 12px 30px -12px rgba(100, 150, 170, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
    margin-bottom: 14px; overflow: hidden; min-height: 200px;
  }
  .stage-bg { position: absolute; inset: 0; pointer-events: none; opacity: 0.6; }
  .stage-bg::before {
    content: ''; position: absolute; top: 20px; right: 30px;
    width: 90px; height: 90px;
    background: radial-gradient(circle, #fff8e0 0%, #ffe8b8 50%, transparent 70%);
    border-radius: 50%; filter: blur(4px);
  }
  .stage-bg::after {
    content: ''; position: absolute; bottom: -30px; left: -20px;
    width: 200px; height: 120px;
    background: radial-gradient(ellipse, rgba(140, 200, 215, 0.5) 0%, transparent 70%);
    border-radius: 50%;
  }
  .tide-deco {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 30px; pointer-events: none; opacity: 0.5;
  }
  .tide-deco svg { width: 100%; height: 100%; }

  .stage-content { position: relative; display: flex; gap: 16px; align-items: flex-start; }

  .daughter-visual {
    flex-shrink: 0; width: 130px; height: 160px;
    position: relative; display: flex; align-items: flex-end; justify-content: center;
  }
  .daughter-avatar {
    font-size: 5.6rem; line-height: 1;
    filter: drop-shadow(0 8px 12px rgba(60, 110, 130, 0.25));
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    animation: breathe 3s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.03) translateY(-3px); }
  }
  .daughter-avatar.happy { animation: bounce 0.6s ease; }
  @keyframes bounce {
    0%, 100% { transform: scale(1) translateY(0); }
    30% { transform: scale(1.15) translateY(-12px); }
    60% { transform: scale(0.95) translateY(0); }
  }
  .daughter-avatar.sad { animation: shake 0.6s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .daughter-avatar.focus { animation: focus-bob 2s ease-in-out infinite; }
  @keyframes focus-bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-4px) rotate(1deg); }
  }
  .daughter-avatar.tired { filter: drop-shadow(0 8px 12px rgba(60, 110, 130, 0.25)) grayscale(0.3); }
  .daughter-shadow {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 70px; height: 12px;
    background: radial-gradient(ellipse, rgba(60, 110, 130, 0.3) 0%, transparent 70%);
    border-radius: 50%;
  }
  .daughter-status-tag {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95); padding: 4px 12px;
    border-radius: 30px; font-size: 0.7rem; font-weight: 700;
    color: var(--sea-700); white-space: nowrap;
    box-shadow: 0 4px 12px -4px rgba(60, 110, 130, 0.3);
    border: 1px solid var(--sea-200);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
  }
  .daughter-status-tag.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .daughter-speech {
    flex: 1; background: #ffffff;
    border-radius: 22px 22px 22px 6px;
    padding: 14px 18px; position: relative;
    box-shadow: 0 8px 24px -8px rgba(60, 110, 130, 0.3),
                inset 0 0 0 1.5px rgba(200, 230, 240, 0.9);
    min-height: 70px; display: flex; align-items: center;
    font-size: 0.85rem; line-height: 1.55; color: var(--ink);
    font-weight: 500; transition: all 0.3s;
  }
  .daughter-speech::before {
    content: ''; position: absolute; left: -8px; bottom: 14px;
    width: 0; height: 0;
    border-right: 12px solid #ffffff;
    border-top: 8px solid transparent; border-bottom: 8px solid transparent;
    filter: drop-shadow(-1px 0 0 rgba(200, 230, 240, 0.9));
  }
  .daughter-speech .text { white-space: pre-line; }

  .daughter-traits { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .trait-chip {
    background: rgba(255, 255, 255, 0.75); border: 1px solid var(--sea-200);
    border-radius: 30px; padding: 3px 10px; font-size: 0.65rem;
    font-weight: 600; color: var(--sea-600);
    display: flex; align-items: center; gap: 3px;
  }
  .trait-chip.personality { background: linear-gradient(135deg, #fff0f7, #fbe0ed); color: var(--pink-dark); border-color: var(--pink); }
  .trait-chip.hobby { background: linear-gradient(135deg, #f0f7ff, #e0eef9); color: #5a7ba0; border-color: #c5ddef; }
  .trait-chip.talent { background: linear-gradient(135deg, #fff8e6, #ffefc8); color: #8a6a2e; border-color: var(--sand-300); }

  /* 属性 - 5 个经典属性 */
  .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .stat-pill {
    background: rgba(255, 255, 255, 0.85); border-radius: 18px;
    padding: 8px 4px 7px; text-align: center;
    border: 1.5px solid var(--sea-100);
    box-shadow: 0 4px 12px -6px rgba(100, 150, 170, 0.25);
    position: relative; overflow: hidden; transition: transform 0.15s;
  }
  .stat-pill.bump { animation: statBump 0.5s ease; }
  @keyframes statBump {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.08); }
  }
  .stat-pill.warn { animation: warnPulse 1s infinite; }
  @keyframes warnPulse {
    0%, 100% { box-shadow: 0 4px 12px -6px rgba(100, 150, 170, 0.25); }
    50% { box-shadow: 0 4px 16px -4px rgba(240, 120, 100, 0.6); }
  }
  .stat-pill .icon { font-size: 1rem; display: block; line-height: 1; }
  .stat-pill .num {
    font-size: 1.15rem; font-weight: 800; color: var(--ink);
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .stat-pill .lbl {
    font-size: 0.6rem; color: var(--ink-soft); font-weight: 600;
    letter-spacing: 0.3px; margin-top: 1px;
  }
  .stat-pill.money .num { color: var(--gold-dark); }
  .stat-bar { height: 3px; background: var(--sea-100); border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .stat-bar > div {
    height: 100%; background: linear-gradient(90deg, var(--sea-300), var(--sea-500));
    border-radius: 3px; transition: width 0.5s ease;
  }
  .stat-pill.money .stat-bar > div { background: linear-gradient(90deg, var(--sand-300), var(--gold)); }
  .stat-pill.stamina .stat-bar > div { background: linear-gradient(90deg, #a8d8c9, #5cb890); }
  .stat-pill.mood .stat-bar > div { background: linear-gradient(90deg, #f5c6d8, #d97da6); }
  .stat-pill.trust .stat-bar > div { background: linear-gradient(90deg, #c9b8e0, #9a7ac8); }

  /* 专注区 */
  .focus-box {
    background: linear-gradient(135deg, #f0f8fa 0%, #e0f0f5 100%);
    border-radius: 28px; padding: 16px 18px;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 28px -14px rgba(100, 150, 170, 0.4), inset 0 1px 0 #fff;
    margin-bottom: 12px;
    display: flex; gap: 18px; align-items: center;
    position: relative;
  }
  .focus-disc-wrap {
    position: relative; width: 160px; height: 160px; flex-shrink: 0;
  }
  #timerCanvas { width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #timerCanvas.locked { cursor: not-allowed; }
  #timerCanvas:active { cursor: grabbing; }
  .focus-disc-info {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
    pointer-events: none; width: 80%;
  }
  .focus-disc-time {
    font-size: 1.7rem; font-weight: 800; color: var(--ink);
    line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 1px;
  }
  .focus-disc-hint {
    font-size: 0.55rem; color: var(--ink-soft); font-weight: 600;
    letter-spacing: 0.5px; margin-top: 3px; text-transform: uppercase;
  }

  .focus-info-col { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .focus-preview {
    background: linear-gradient(135deg, #fff8e6, #ffefc8);
    border-radius: 16px; padding: 9px 14px;
    border: 1.5px solid var(--sand-300);
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 10px -4px rgba(200, 160, 80, 0.3);
  }
  .focus-preview .lbl { font-size: 0.7rem; color: #a17b3a; font-weight: 600; }
  .focus-preview .val { font-size: 1.1rem; font-weight: 800; color: var(--gold-dark); display: flex; align-items: center; gap: 4px; }
  .focus-buttons { display: flex; gap: 8px; }
  .focus-buttons .btn { flex: 1; padding: 11px 10px; font-size: 0.85rem; }
  .focus-companion {
    font-size: 0.7rem; color: var(--sea-600); text-align: center;
    padding: 6px; background: rgba(255, 255, 255, 0.7);
    border-radius: 12px; border: 1px solid var(--sea-100);
    display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 600;
  }
  .focus-companion .dot {
    width: 6px; height: 6px; background: var(--sea-400);
    border-radius: 50%; animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* 按钮 */
  .btn {
    border: none; background: rgba(255, 255, 255, 0.95);
    padding: 11px 18px; border-radius: 50px;
    font-weight: 700; font-size: 0.88rem; color: var(--sea-700);
    box-shadow: 0 5px 12px -5px rgba(60, 110, 130, 0.35), inset 0 0 0 1.5px var(--sea-100);
    cursor: pointer; transition: all 0.12s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 6px -2px rgba(60, 110, 130, 0.35), inset 0 0 0 1.5px var(--sea-100); }
  .btn:disabled { opacity: 0.4; transform: none; pointer-events: none; filter: grayscale(0.4); }
  .btn-primary {
    background: linear-gradient(135deg, var(--sea-300), var(--sea-500));
    color: #fff; box-shadow: 0 6px 14px -5px var(--sea-500), inset 0 0 0 1.5px #d9eef5;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .btn-primary:active { box-shadow: 0 2px 6px -2px var(--sea-500), inset 0 0 0 1.5px #d9eef5; }
  .btn-coral {
    background: linear-gradient(135deg, var(--coral-300), var(--coral-500));
    color: #fff; box-shadow: 0 6px 14px -5px var(--coral-500), inset 0 0 0 1.5px #ffe8e0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  /* 主界面按钮 */
  .main-actions {
    display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px;
  }
  .btn-schedule {
    background: linear-gradient(135deg, #d9c6f0, #b89ae0);
    color: #fff; box-shadow: 0 8px 18px -6px #b89ae0, inset 0 0 0 1.5px #eee4ff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    padding: 15px 18px; font-size: 1rem; font-weight: 800;
    border-radius: 50px; border: none; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.15s;
  }
  .btn-schedule:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -6px #b89ae0, inset 0 0 0 1.5px #eee4ff; }
  .btn-schedule:active { transform: translateY(2px); }

  /* 底部 */
  .bottom-bar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(30, 60, 75, 0.45);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    padding: 18px; z-index: 1000;
    visibility: hidden; opacity: 0; transition: 0.25s;
  }
  .modal-overlay.show { visibility: visible; opacity: 1; }
  .modal-content {
    background: linear-gradient(180deg, #fafdff 0%, #f0f8fa 100%);
    max-width: 620px; width: 100%; max-height: 90vh;
    border-radius: 36px; padding: 26px 24px;
    box-shadow: 0 40px 80px -30px #1f3a44, inset 0 0 0 1.5px rgba(255, 255, 255, 0.9);
    border: 1.5px solid var(--sea-200);
    overflow-y: auto; position: relative;
    animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-content h2 {
    color: var(--sea-700); margin-bottom: 16px; font-size: 1.5rem;
    display: flex; align-items: center; gap: 9px;
    padding-bottom: 12px; border-bottom: 2px dashed var(--sea-200); font-weight: 800;
  }
  .modal-content h3 {
    color: var(--sea-700); margin: 18px 0 10px; font-size: 1rem;
  }
  .close-btn {
    position: absolute; top: 18px; right: 20px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--sea-100);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 1.3rem; cursor: pointer; color: var(--sea-500);
    line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit;
    z-index: 10;
  }
  .close-btn:hover { background: var(--sea-100); color: var(--sea-700); }

  .story-text {
    font-size: 0.9rem; line-height: 1.85; color: var(--ink);
    margin-bottom: 18px; white-space: pre-line;
  }

  /* 开场名字卡 */
  .name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 12px; }
  .name-card {
    background: #fff; border: 1.5px solid var(--sea-100);
    border-radius: 18px; padding: 12px 8px; text-align: center;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 4px 12px -8px rgba(100, 150, 170, 0.3);
  }
  .name-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(100, 150, 170, 0.4); }
  .name-card.selected {
    background: linear-gradient(135deg, #f0f8fa, #e0f0f5);
    border-color: var(--sea-400);
    box-shadow: 0 6px 16px -6px rgba(60, 140, 170, 0.5), inset 0 0 0 1.5px #fff;
  }
  .name-card .em { font-size: 1.6rem; }
  .name-card .nm { font-weight: 800; color: var(--ink); font-size: 0.95rem; margin-top: 3px; }
  .name-card .traits { font-size: 0.6rem; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
  .name-card .talent-tag {
    display: inline-block; margin-top: 4px;
    background: linear-gradient(135deg, #ffe8a8, #ffd878);
    color: #6a4a10; font-size: 0.55rem; font-weight: 800;
    padding: 2px 7px; border-radius: 20px;
  }

  .form-row { margin-top: 10px; }
  .form-row label {
    display: block; font-weight: 700; color: var(--sea-700);
    font-size: 0.78rem; margin-bottom: 5px;
  }
  .form-row input[type="text"] {
    width: 100%; padding: 11px 16px; border-radius: 40px;
    border: 1.5px solid var(--sea-200); background: white;
    font-size: 0.88rem; outline: none; color: var(--ink);
    font-weight: 600; font-family: inherit;
  }
  .form-row input[type="text"]:focus { border-color: var(--sea-400); box-shadow: 0 0 0 3px #e0f0f5; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip {
    background: #fff; border: 1.5px solid var(--sea-200);
    border-radius: 30px; padding: 6px 12px; font-size: 0.75rem;
    font-weight: 600; color: var(--sea-600); cursor: pointer;
    transition: 0.15s; font-family: inherit;
  }
  .chip:hover { background: var(--sea-50); }
  .chip.selected {
    background: linear-gradient(135deg, var(--sea-300), var(--sea-500));
    color: #fff; border-color: var(--sea-500);
    box-shadow: 0 4px 10px -4px var(--sea-500);
  }

  /* 成就弹窗 */
  .achievement-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #fff8e6, #ffefc8);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 14px 24px;

function angleToMinutes(angle) {
  let a = angle + Math.PI / 2;
  if (a < 0) a += Math.PI * 2;
  const ratio = a / (Math.PI * 2);
  return Math.round(FOCUS_MIN + ratio * (FOCUS_MAX - FOCUS_MIN));
}
function minutesToAngle(min) {
  const ratio = (min - FOCUS_MIN) / (FOCUS_MAX - FOCUS_MIN);
  return -Math.PI / 2 + ratio * Math.PI * 2;
}

/* ==================== 工具 ==================== */
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
function formatDuration(sec) {
  if (sec < 60) return sec + '秒';
  if (sec < 3600) return Math.floor(sec / 60) + '分钟';
  return Math.floor(sec / 3600) + '小时' + Math.floor((sec % 3600) / 60) + '分';
}

/* ==================== 心情过低掉羁绊 ==================== */
function checkLowMood() {
  if (state.mood <= 20 && !state.lowMoodWarned) {
    state.lowMoodWarned = true;
    state.trust = clamp(state.trust - 5, 0, 100);
    floatNumMulti([{ text: '-5 羁绊（心情过低）', color: '#c05a72' }], true);
    unlockMemory('lowMood');
  } else if (state.mood > 35) {
    state.lowMoodWarned = false;
  }
}

/* ==================== 天赋计算 ==================== */
function calcEffectWithTalent(task) {
  const effect = { ...task.effect };
  const tb = state.profile.talentBonus;
  const talentMatch = task.skill && task.skill === tb;
  let isTalentBoost = false;
  if (talentMatch) {
    isTalentBoost = true;
    for (const k in effect) {
      if (effect[k] > 0) effect[k] = Math.round(effect[k] * 1.5);
      else if (effect[k] < 0) effect[k] = Math.round(effect[k] * 0.5);
    }
  }
  return { effect, isTalentBoost };
}

  if (effect.flags) {
    for (const k in effect.flags) {
      state.flags[k] = (state.flags[k] || 0) + effect.flags[k];
    }
  }
  if (lines.length > 0) floatNumMulti(lines, false);
  checkLowMood();
  updateStatsUI();

/* 浮字：每行一个，依次飘出 */
function floatNumMulti(lines, isWarning) {
  const baseX = window.innerWidth / 2;
  const baseY = window.innerHeight / 2 - 60;
  lines.forEach((line, i) => {
    const el = document.createElement('div');
    el.className = 'float-num';
    el.textContent = line.text;
    el.style.color = line.color;
    el.style.left = baseX + 'px';
    el.style.top = (baseY + i * 26) + 'px';
    el.style.animation = `floatUpMulti 1.4s ease-out ${i * 0.08}s forwards`;
    if (isWarning) {
      el.style.fontSize = '1.15rem';
      el.style.animation = `floatUpMulti 1.8s ease-out forwards`;
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000 + i * 100);
  });
}

/* ==================== 回忆 ==================== */
function unlockMemory(key) {
  if (!MEMORY_POOL[key]) return;
  if (state.memories && state.memories.includes(key)) return;
  if (!state.memories) state.memories = [];
  state.memories.push(key);
  profile.totalMemories.add(key);

}

/* ==================== 专注计时 ==================== */
function clearTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  isTimerRunning = false;
}

const FOCUS_COMPANION_LINES = [
  '女儿安静地陪着你…', '她趴在桌边，偷偷看你…', '她小声哼着歌，不想打扰你…',
  '她在旁边画画，偶尔抬头看你一眼…', '她帮你倒了一杯水，轻轻放在桌上…',
];

function toggleTimer() {
  if (isTimerRunning) {
    clearTimer();
    startPauseBtn.textContent = '▶ 继续';
    focusCompanion.style.display = 'none';
    daughterAvatar.classList.remove('focus');
    canvas.classList.remove('locked');
    drawDisc();
    return;
  }

  isTimerRunning = true;
  startPauseBtn.textContent = '⏸ 暂停';
  focusCompanion.style.display = 'flex';
  companionText.textContent = rand(FOCUS_COMPANION_LINES);
  avatarAnimate('focus');
  canvas.classList.add('locked');

  if (extraStats.focusCount === 0 && focusElapsedSec === 0) {
    setTimeout(() => unlockMemory('firstFocus'), 1200);
  }

  const companionTimer = setInterval(() => {
    if (isTimerRunning) companionText.textContent = rand(FOCUS_COMPANION_LINES);
    else clearInterval(companionTimer);
  }, 8000);

  lastTickTime = Date.now();
  timerInterval = setInterval(() => {
    const now = Date.now();
    const delta = Math.floor((now - lastTickTime) / 1000);
    if (delta <= 0) return;
    lastTickTime = now;

    focusElapsedSec += delta;
    const totalSec = state.focusMinutes * 60;
    // 1 分钟 = 1 币
    const perSec = 1 / 60;
    sessionGold.textContent = Math.floor(focusElapsedSec * perSec);

    drawDisc();

    if (focusElapsedSec >= totalSec) {
      clearTimer();
      startPauseBtn.textContent = '▶ 开始';
      focusCompanion.style.display = 'none';
      daughterAvatar.classList.remove('focus');
      canvas.classList.remove('locked');
      clearInterval(companionTimer);

      if (!sessionRewarded) {
        const earned = Math.floor(totalSec / 60); // 1 分钟 = 1 币
        state.money += earned;
        state.mood = clamp(state.mood + 3, 0, 100);
        state.stamina = clamp(state.stamina + 5, 0, 100); // 专注也恢复少量体力
        extraStats.focusCount++;
        extraStats.totalFocusSeconds += totalSec;
        profile.totalFocusSeconds += totalSec;
        saveProfile();
        sessionRewarded = true;
        setSpeech(`专注完成！赚到了 ${earned} 个贝壳～`, 'happy');
        avatarAnimate('happy');
        floatNumMulti([{ text: `+${earned} 🐚`, color: '#b88a3d' }, { text: '+3 心情', color: '#d97da6' }, { text: '+5 体力', color: '#5cb890' }], false);
        checkAchievements();
        updateStatsUI();
      }
      focusElapsedSec = 0;
      sessionRewarded = false;
      sessionGold.textContent = '0';
      drawDisc();
    }
  }, 200);
}

function resetTimer() {
  clearTimer();
  startPauseBtn.textContent = '▶ 开始';
  focusElapsedSec = 0;
  sessionRewarded = false;
  sessionGold.textContent = '0';
  focusCompanion.style.display = 'none';
  daughterAvatar.classList.remove('focus');
  canvas.classList.remove('locked');
  drawDisc();
}

/* ==================== 圆盘绘制 ==================== */
function drawDisc() {
  if (!ctx) return;
  ctx.clearRect(0, 0, 320, 320);

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#d0e8ef';
  ctx.lineWidth = 18;
  ctx.stroke();

  if (isTimerRunning) {
    const totalSec = state.focusMinutes * 60;
    const progress = clamp(focusElapsedSec / totalSec, 0, 1);
    if (progress > 0) {
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + progress * Math.PI * 2;
      const grad = ctx.createLinearGradient(0, 0, 320, 320);
      grad.addColorStop(0, '#5faec4');
      grad.addColorStop(1, '#2c6f85');
      ctx.beginPath();
      ctx.arc(CX, CY, R, startAngle, endAngle, false);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    focusTime.textContent = Math.round(progress * 100) + '%';
    focusHint.textContent = '专注中…';
  } else {
    const startAngle = -Math.PI / 2;
    const endAngle = minutesToAngle(state.focusMinutes);
    const grad = ctx.createLinearGradient(0, 0, 320, 320);
    grad.addColorStop(0, '#5faec4');
    grad.addColorStop(1, '#2c6f85');
    ctx.beginPath();
    ctx.arc(CX, CY, R, startAngle, endAngle, false);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.stroke();

    for (let m = FOCUS_MIN; m <= FOCUS_MAX; m += 5) {
      const a = minutesToAngle(m);
      const isMajor = m % 15 === 0;
      const innerR = R - (isMajor ? 32 : 26);
      const outerR = R - 14;
      const x1 = CX + innerR * Math.cos(a);
      const y1 = CY + innerR * Math.sin(a);
      const x2 = CX + outerR * Math.cos(a);
      const y2 = CY + outerR * Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = m <= state.focusMinutes ? '#2c6f85' : '#c0e0eb';
      ctx.lineWidth = isMajor ? 2.5 : 1.5;
      ctx.stroke();

      if (m % 15 === 0) {
        const labelR = R - 46;
        const lx = CX + labelR * Math.cos(a);
        const ly = CY + labelR * Math.sin(a);
        ctx.fillStyle = m <= state.focusMinutes ? '#2c6f85' : '#90c8d8';
        ctx.font = 'bold 11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(m, lx, ly);
      }
    }

    const handleAngle = minutesToAngle(state.focusMinutes);
    const hx = CX + R * Math.cos(handleAngle);
    const hy = CY + R * Math.sin(handleAngle);
    ctx.beginPath();
    ctx.arc(hx, hy, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#2c6f85';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#2c6f85';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hx, hy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2c6f85';
    ctx.fill();

    focusTime.textContent = state.focusMinutes;
    focusHint.textContent = '分钟 · 拖动圆环';
  }

  ctx.beginPath();
  ctx.arc(CX, CY, R - 26, 0, Math.PI * 2);
  ctx.fillStyle = '#fafdff';
  ctx.fill();
  ctx.strokeStyle = '#e0f0f5';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function bindCanvas() {
  if (!canvas) return;
  function getMinutesFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = (clientX - rect.left) * (320 / rect.width);
    const y = (clientY - rect.top) * (320 / rect.height);
    const dx = x - CX;
    const dy = y - CY;
    return angleToMinutes(Math.atan2(dy, dx));
  }
  function startDrag(e) {
    if (isTimerRunning) return;
    discDragging = true;
    state.focusMinutes = clamp(getMinutesFromEvent(e), FOCUS_MIN, FOCUS_MAX);
    drawDisc();
    e.preventDefault();
  }
  function moveDrag(e) {
    if (!discDragging || isTimerRunning) return;
    state.focusMinutes = clamp(getMinutesFromEvent(e), FOCUS_MIN, FOCUS_MAX);
    drawDisc();
    e.preventDefault();
  }
  function endDrag() { discDragging = false; }
  canvas.addEventListener('mousedown', startDrag);
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', endDrag);
}

function renderScheduleModal() {

}
function renderScheduleContent() {
  const inner = document.getElementById('scheduleInner');
  if (!inner) return;

  // 四季槽
  const seasonsHtml = SEASON_KEYS.map(key => {
    const meta = SEASON_META[key];
    const slot = state.schedule[key];
    if (slot) {
      const s = SCHEDULES.find(x => x.id === slot);
      return `
        <div class="season-slot ${key}">
          <button class="s-remove" data-season="${key}">×</button>

              <div class="s-emoji">${s.emoji}</div>
              <div class="s-label">${s.name}</div>
            </div>
          </div>

      `;
    } else {
      return `
        <div class="season-slot ${key}">
          <div class="s-icon">${meta.icon}</div>
          <div class="s-name">${meta.name}</div>
          <div class="s-content">
            <div class="s-empty">待安排</div>
          </div>
        </div>
      `;
    }
  }).join('');

  // 可选日程
  const schedulesHtml = SCHEDULES.map(s => {
    const canAfford = state.money >= s.cost;
    const isTalent = s.skill && s.skill === state.profile.talentBonus;
    const costHtml = s.cost === 0
      ? `<span class="sc-cost free">免费</span>`
      : `<span class="sc-cost ${!canAfford ? 'insufficient' : ''}">🐚${s.cost}</span>`;
    return `
      <div class="schedule-card ${!canAfford ? 'disabled' : ''}" data-id="${s.id}">
        <span class="sc-emoji">${s.emoji}</span>
        <div class="sc-info">
          <div class="sc-name">${s.name}${isTalent ? ' <span style="color:var(--gold-dark);font-size:0.6rem;">★天赋</span>' : ''}</div>
          <div class="sc-effect">${s.desc}</div>
        </div>
        ${costHtml}
      </div>
    `;
  }).join('');

  const allFilled = SEASON_KEYS.every(k => state.schedule[k] !== null);
  const totalCost = SEASON_KEYS.reduce((sum, k) => {
    const id = state.schedule[k];
    if (!id) return sum;
    const s = SCHEDULES.find(x => x.id === id);
    return sum + (s ? s.cost : 0);
  }, 0);
  const canAffordAll = state.money >= totalCost;

  inner.innerHTML = `
    <div class="seasons-grid" id="seasonsGrid">${seasonsHtml}</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 8px 0 12px;">
      <div style="font-size:0.78rem; color:var(--ink-soft);">
        已选 <strong>${SEASON_KEYS.filter(k => state.schedule[k]).length}/4</strong> · 
        预计花费 <strong style="color:var(--gold-dark);">🐚${totalCost}</strong> · 
        当前 <strong style="color:var(--gold-dark);">🐚${state.money}</strong>
      </div>
    </div>
    <h3 style="margin-top:0;">可选日程</h3>
    <div class="schedule-list" id="scheduleList">${schedulesHtml}</div>
    <div class="schedule-actions">
      <button class="btn" style="flex:1;" id="clearScheduleBtn">🗑️ 清空</button>
      <button class="btn btn-primary" style="flex:2;" id="executeScheduleBtn" ${(!allFilled || !canAffordAll) ? 'disabled' : ''}>
        ${!allFilled ? `还需安排 ${4 - SEASON_KEYS.filter(k => state.schedule[k]).length} 个季节` : (!canAffordAll ? '贝壳币不足' : '▶ 开始执行')}
      </button>
    </div>
  `;

  // 绑定事件
  inner.querySelectorAll('.schedule-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const s = SCHEDULES.find(x => x.id === id);
      if (!s) return;
      if (state.money < s.cost) return;
      // 找第一个空槽
      const emptyKey = SEASON_KEYS.find(k => state.schedule[k] === null);
      if (!emptyKey) {
        // 全部已满，替换最后一个
        state.schedule[SEASON_KEYS[3]] = id;
      } else {
        state.schedule[emptyKey] = id;
      }
      renderScheduleContent();
    });
  });
  inner.querySelectorAll('.s-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const season = btn.dataset.season;
      state.schedule[season] = null;
      renderScheduleContent();
    });
  });
  document.getElementById('clearScheduleBtn')?.addEventListener('click', () => {
    SEASON_KEYS.forEach(k => state.schedule[k] = null);
    renderScheduleContent();
  });
  document.getElementById('executeScheduleBtn')?.addEventListener('click', () => {
    closeModal();
    executeSchedule();
  });
}

/* ==================== 执行日程 ==================== */
function executeSchedule() {
  const queue = SEASON_KEYS.filter(k => state.schedule[k]).map(k => ({
    season: k,
    scheduleId: state.schedule[k],
  }));

  // 扣除总花费
  const totalCost = queue.reduce((sum, item) => {
    const s = SCHEDULES.find(x => x.id === item.scheduleId);
    return sum + (s ? s.cost : 0);
  }, 0);
  state.money -= totalCost;

  executeNextSeason(queue, 0);
}

function executeNextSeason(queue, index) {
  if (index >= queue.length) {
    // 全部执行完，进入下一年
    setTimeout(() => advanceYear(), 800);
    return;
  }

  const item = queue[index];
  const meta = SEASON_META[item.season];
  const s = SCHEDULES.find(x => x.id === item.scheduleId);
  if (!s) { executeNextSeason(queue, index + 1); return; }

  // 检查体力
  const staminaCost = s.effect.stamina || 0;
  if (staminaCost < 0 && state.stamina + staminaCost < 0) {
    // 体力不足，强制休息
    openModal(`
      <button class="close-btn" id="closeModalBtn" style="display:none;">×</button>
      <div class="executing-panel">
        <div class="executing-season">😴</div>
        <div class="executing-title">${meta.name}天 · 太累了</div>
        <div class="executing-desc">她已经很累了，没办法去${s.name}。<br>你让她在家好好休息了一天。</div>
        <button class="btn btn-primary" style="margin-top:14px;" id="nextSeasonBtn">继续 →</button>
      </div>
    `);
    // 强制休息：恢复体力
    state.stamina = clamp(state.stamina + 30, 0, 100);
    state.mood = clamp(state.mood + 5, 0, 100);
    floatNumMulti([{ text: '+30 体力', color: '#5cb890' }, { text: '+5 心情', color: '#d97da6' }], false);
    setTimeout(() => {
      document.getElementById('nextSeasonBtn')?.addEventListener('click', () => {
        closeModal();
        executeNextSeason(queue, index + 1);
      });
    }, 30);
    return;
  }

  // 应用效果
  const { effect, isTalentBoost } = calcEffectWithTalent(s);
  applyEffect(effect);
  if (s.skill && state.skills[s.skill] !== undefined) {
    state.skills[s.skill] = Math.min(5, state.skills[s.skill] + 1);
  }

  // 显示执行动画
  openModal(`
    <button class="close-btn" id="closeModalBtn" style="display:none;">×</button>
    <div class="executing-panel">
      <div class="executing-season">${meta.icon}</div>
      <div class="executing-title">${meta.name}天 · ${s.name}</div>
      <div class="executing-desc">${s.desc}${isTalentBoost ? '<br><span style="color:var(--gold-dark);font-weight:700;">🌟 天赋加成！</span>' : ''}</div>
      <div class="executing-avatar">${state.profile.emoji}</div>
      <div class="executing-progress"><div id="execProgress"></div></div>
    </div>
  `);

  setTimeout(() => {
    const bar = document.getElementById('execProgress');
    if (bar) bar.style.width = '100%';
  }, 50);

  // 1.5 秒后判断是否触发偶发事件
  setTimeout(() => {
    closeModal();
    // 25% 概率触发偶发事件
    if (Math.random() < 0.25) {
      triggerIncident(() => executeNextSeason(queue, index + 1));
    } else {
      executeNextSeason(queue, index + 1);
    }
  }, 1600);
}

/* ==================== 偶发事件 ==================== */
function triggerIncident(onDone) {
  // 优先触发"有剧情"的选择事件
  const availableChoices = CHOICE_EVENTS.filter(e =>
    (!e.minAge || state.age >= e.minAge) && !state.seenEvents.has(e.id)
  );
  const availableRandom = RANDOM_EVENTS.filter(e => !state.seenEvents.has(e.id));

  if (availableChoices.length === 0 && availableRandom.length === 0) {
    if (onDone) onDone();
    return;
  }

  // 60% 概率触发选择事件（如果有）
  const useChoice = availableChoices.length > 0 && (availableRandom.length === 0 || Math.random() < 0.6);

  if (useChoice) {
    showChoiceEvent(rand(availableChoices), onDone);
  } else {
    const evt = rand(availableRandom);
    state.seenEvents.add(evt.id);
    extraStats.eventsTriggered++;
    applyEffect(evt.effect);
    setTimeout(() => {
      setSpeech(evt.type === 'good' ? rand(['今天遇到了好事！', '好开心呀～']) : rand(['……有点难过。', '我不太开心。']), evt.type === 'good' ? 'happy' : 'sad', 3000);
      if (onDone) setTimeout(onDone, 800);
    }, 400);
  }
}

function showChoiceEvent(event, onDone) {
  state.seenEvents.add(event.id);
  const choicesHtml = event.choices.map((c, i) => `
    <button class="choice-btn" data-choice="${i}" style="background:linear-gradient(135deg,#f0f8fa,#e0f0f5);border:1.5px solid var(--sea-200);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;transition:all 0.15s;font-family:inherit;width:100%;margin-bottom:8px;">
      <div style="font-weight:800; font-size:0.9rem; color:var(--sea-700); margin-bottom:4px;">${c.title}</div>
      <div style="font-size:0.75rem; color:var(--ink-soft); line-height:1.5;">${c.desc}</div>
      <div style="font-size:0.65rem; color:var(--gold-dark); margin-top:6px; font-weight:700;">${Object.entries(c.effect).map(([k, v]) => {
        const labels = { intelligence: '智力', charm: '魅力', stamina: '体力', mood: '心情', trust: '羁绊', money: '贝壳币' };
        return `${labels[k] || k} ${v > 0 ? '+' : ''}${v}`;
      }).join(' · ')}</div>
    </button>
  `).join('');

  openModal(`
    <button class="close-btn" id="closeModalBtn" style="display:none;">×</button>
    <h2>${event.emoji} ${event.title}</h2>
    <div class="story-text">${event.text}</div>
    <div class="choice-list" id="choiceList">${choicesHtml}</div>
  `);

  setTimeout(() => {
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.choice, 10);
        const choice = event.choices[idx];
        applyEffect(choice.effect);
        extraStats.choicesMade++;
        state.choices.push({ eventId: event.id, choiceId: choice.id });
        if (choice.flags) {
          for (const k in choice.flags) {
            state.flags[k] = (state.flags[k] || 0) + choice.flags[k];
          }
        }
        closeModal();
        setTimeout(() => {
          setSpeech(choice.reaction, state.mood >= 50 ? 'happy' : 'normal', 4000);
          checkAchievements();
          updateStatsUI();
          if (onDone) setTimeout(onDone, 800);
        }, 400);
      });
    });
  }, 30);
}

/* ==================== 推进年份 ==================== */
function advanceYear() {
  // 清空日程
  SEASON_KEYS.forEach(k => state.schedule[k] = null);

  // 年度结算
  state.year++;
  state.age++;

  // 年底恢复一点体力和心情
  state.stamina = clamp(state.stamina + 10, 0, 100);
  state.mood = clamp(state.mood + 5, 0, 100);

  // 特殊年份回忆
  if (state.year === 3) unlockMemory('year3');
  if (state.year === 5) unlockMemory('year5');
  if (state.year === 7) unlockMemory('year7');
  if (state.year === 9) unlockMemory('year9');

  // 检查是否到结局
  if (state.year > state.maxYears) {
    triggerEnding();
    return;
  }

  updateStatsUI();
  setSpeech(rand(state.profile.catchphrases[state.mood >= 70 ? 'happy' : state.mood < 40 ? 'sad' : 'normal']));
  avatarAnimate(state.mood >= 70 ? 'happy' : null);
}

/* ==================== 结局 ==================== */
function determineEnding() {
  const sorted = [...ENDINGS].sort((a, b) => b.priority - a.priority);
  for (const e of sorted) {
    if (e.condition(state)) return e;
  }
  return ENDINGS.find(e => e.id === 'ordinary');
}

function generateLetter() {
  const trustHigh = state.trust >= 75;
  const moodHigh = state.mood >= 70;
  let content = `亲爱的${state.playerTitle}：\n\n`;
  if (trustHigh && moodHigh) {
    content += `写下这封信的时候，我刚刚过完我的十八岁生日。\n\n窗外是海，和十年前你第一次把我抱回家的那天一样。\n\n我一直以为"长大"是很遥远的事，直到今天我才意识到——原来我已经走过了那么远的路，而回头看，你一直在那里。\n\n`;
  } else {
    content += `写下这封信的时候，我刚到港口。\n\n船上的人都在忙碌，只有我一个人靠在栏杆上，看着越来越远的海岸线。\n\n忽然觉得，应该把这十年没说的话，都写下来。\n\n`;
  }
  content += `我记得八岁那年，你第一次为我专注的样子。那盏灯很暖。\n\n`;
  content += `\n${state.playerTitle}，谢谢你。\n\n`;
  content += `谢谢你在我害怕的时候没有走开。\n`;
  content += `谢谢你在我说"我有个梦想"的时候，只是点头。\n`;
  content += `谢谢你给了我一个家，然后让我自由地离开它。\n\n`;
  content += `我现在很好。\n\n你把我养得很好。\n\n`;
  return { content, signature: `永远爱你的 ${state.name}` };
}

function triggerEnding() {
  unlockMemory('beforeEnding');
  const ending = determineEnding();
  profile.totalEndings.add(ending.id);
  profile.kidsRaised.push({
    name: state.name,
    emoji: state.profile.emoji,
    talent: state.profile.talent,
    endingName: ending.name,
    endingEmoji: ending.emoji,
    date: new Date().toLocaleDateString('zh-CN'),

    focusSec: extraStats.totalFocusSeconds,
  });
  saveProfile();
  checkAchievements();
  setTimeout(() => showEndingModal(ending), 600);
}

        <button class="close-btn" id="closeModalBtn">×</button>
        <div style="text-align:center; padding: 6px 0;">
          <h2 style="justify-content:center; border-bottom:none;">💌 女儿的信</h2>
          <div class="letter-paper">${content}<div class="letter-signature">—— ${signature}</div></div>
          <div style="display:flex; gap:8px; margin-top:16px; justify-content:center;">
            <button class="btn btn-primary" id="backToEndingBtn">← 回到结局</button>
          </div>
        </div>
      `);
      setTimeout(() => {
        document.getElementById('backToEndingBtn')?.addEventListener('click', () => showEndingModal(ending));
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
      }, 30);
    });
    document.getElementById('showEpilogueBtn')?.addEventListener('click', () => {
      openModal(`
        <button class="close-btn" id="closeModalBtn">×</button>
        <div class="finale-stage">
          <div class="finale-emoji" style="animation:none;">🌅</div>
          <h2 style="justify-content:center; border-bottom:none;">尾声</h2>
          <div class="finale-story" style="margin-top:0;">${ending.epilogue}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-primary" style="flex:1;" id="backToEnding2Btn">← 回到结局</button>
          </div>
        </div>
      `);
      setTimeout(() => {
        document.getElementById('backToEnding2Btn')?.addEventListener('click', () => showEndingModal(ending));
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
      }, 30);
    });
    document.getElementById('restartBtn')?.addEventListener('click', () => { closeModal(); restartGame(); });
    document.getElementById('openProfileBtn')?.addEventListener('click', () => { closeModal(); openProfile(); });
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
  }, 30);
}

/* ==================== 档案（含图鉴/攻略） ==================== */
function openProfile() {
  openProfileTab('main');
}

function openProfileTab(tab) {
  if (tab === 'main') renderProfileMain();
  else if (tab === 'gallery') renderGallery();
  else if (tab === 'guide') renderGuide();
}

function profileTabsHtml(active) {
  return `
    <div class="profile-tabs">
      <button class="profile-tab ${active === 'main' ? 'active' : ''}" data-tab="main">👤 档案</button>
      <button class="profile-tab ${active === 'gallery' ? 'active' : ''}" data-tab="gallery">📖 图鉴</button>
      <button class="profile-tab ${active === 'guide' ? 'active' : ''}" data-tab="guide">📘 攻略</button>
    </div>
  `;
}

function bindProfileTabs() {
  document.querySelectorAll('.profile-tab').forEach(t => {
    t.addEventListener('click', () => {
      openProfileTab(t.dataset.tab);
    });
  });
}

function renderProfileMain() {
  const kidListHtml = profile.kidsRaised.length === 0
    ? `<div class="empty-state">还没有养过孩子呢～</div>`
    : profile.kidsRaised.slice().reverse().map(k => `
      <div class="past-kid">
        <div class="k-emoji">${k.emoji}</div>
        <div class="k-info">
          <div class="k-name">${k.name}</div>
          <div class="k-meta">${k.tags.join(' · ')} · ${k.date}</div>
        </div>
        <div class="k-ending">${k.endingEmoji} ${k.endingName}</div>
      </div>
    `).join('');

  openModal(`
    <button class="close-btn" id="closeModalBtn">×</button>
    <h2>📋 我的档案</h2>
    ${profileTabsHtml('main')}
    <div class="profile-header">
      <div class="profile-avatar">🧑‍🍼</div>
      <div class="profile-info">
        <div class="name">${profile.playerName}</div>
        <div class="sub">潮汐镇 · 守望者</div>
      </div>
    </div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="num">${profile.kidsRaised.length}</div><div class="lbl">养过的孩子</div></div>
      <div class="profile-stat"><div class="num">${profile.totalEndings.size}</div><div class="lbl">解锁结局</div></div>
      <div class="profile-stat"><div class="num">${profile.totalAchievements.size}</div><div class="lbl">解锁成就</div></div>
      <div class="profile-stat"><div class="num">${profile.totalMemories.size}</div><div class="lbl">回忆碎片</div></div>
      <div class="profile-stat"><div class="num">${formatDuration(profile.totalFocusSeconds)}</div><div class="lbl">累计专注</div></div>
      <div class="profile-stat"><div class="num">${ENDINGS.length}</div><div class="lbl">结局总数</div></div>
    </div>
    <h3>👧 养过的孩子们</h3>
    <div class="past-kids">${kidListHtml}</div>
    <div style="margin-top:18px; padding-top:14px; border-top:1px dashed var(--sea-200);">
      <h3>⚙️ 玩家名</h3>
      <div class="form-row"><input type="text" id="playerNameInput" value="${profile.playerName}" maxlength="12"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" id="savePlayerNameBtn">保存名字</button>
    </div>
    <div style="margin-top:14px; padding-top:14px; border-top:1px dashed #f8c4d0;">
      <h3 style="color:#c05a72;">⚠️ 危险操作</h3>
      <button class="danger-btn" id="resetProfileBtn">🗑️ 清空全部档案</button>
    </div>
  `);
  setTimeout(() => {
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
    document.getElementById('savePlayerNameBtn')?.addEventListener('click', () => {
      const v = document.getElementById('playerNameInput').value.trim();
      if (v) { profile.playerName = v; saveProfile(); renderProfileMain(); }
    });
    document.getElementById('resetProfileBtn')?.addEventListener('click', () => {
      if (confirm('确定要清空全部档案吗？此操作不可恢复。')) {
        profile.kidsRaised = [];
        profile.totalFocusSeconds = 0;
        profile.totalEndings = new Set();
        profile.totalAchievements = new Set();
        profile.totalMemories = new Set();
        profile.playerName = '玩家';
        saveProfile();
        renderProfileMain();
      }
    });
    bindProfileTabs();
  }, 30);
}

function renderGallery() {
  const endingsHtml = ENDINGS.map(e => {
    const unlocked = profile.totalEndings.has(e.id);
    return `<div class="gallery-item ${unlocked ? '' : 'locked'}">
      <div class="gallery-emoji">${unlocked ? e.emoji : '❓'}</div>
      <div class="gallery-name">${unlocked ? e.name : '未解锁'}</div>
      <div class="gallery-desc">${unlocked ? e.desc.split('\n')[0].substring(0, 25) + '...' : '达成条件后解锁'}</div>
    </div>`;
  }).join('');
  const achHtml = ACHIEVEMENTS.map(a => {
    const unlocked = profile.totalAchievements.has(a.id);
    return `<div class="gallery-item ${unlocked ? '' : 'locked'}">
      <div class="gallery-emoji">${unlocked ? a.emoji : '🔒'}</div>
      <div class="gallery-name">${unlocked ? a.name : '未解锁'}</div>
      <div class="gallery-desc">${unlocked ? a.desc : '继续努力'}</div>
    </div>`;
  }).join('');
  const memHtml = Object.entries(MEMORY_POOL).map(([key, m]) => {
    const unlocked = profile.totalMemories.has(key);
    return `<div class="gallery-item ${unlocked ? '' : 'locked'}">
      <div class="gallery-emoji">${unlocked ? m.icon : '🔒'}</div>
      <div class="gallery-name">${unlocked ? m.title : '未解锁'}</div>
      <div class="gallery-desc">${unlocked ? '已收集' : '继续陪伴解锁'}</div>
    </div>`;
  }).join('');

  openModal(`<button class="close-btn" id="closeModalBtn">×</button>
    <h2>📖 图鉴</h2>
    ${profileTabsHtml('gallery')}
    <h3>🏆 结局 (${profile.totalEndings.size}/${ENDINGS.length})</h3>
    <div class="gallery-grid">${endingsHtml}</div>
    <h3>🎖️ 成就 (${profile.totalAchievements.size}/${ACHIEVEMENTS.length})</h3>
    <div class="gallery-grid">${achHtml}</div>
    <h3>📔 回忆 (${profile.totalMemories.size}/${Object.keys(MEMORY_POOL).length})</h3>
    <div class="gallery-grid">${memHtml}</div>
  `);
  setTimeout(() => {
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
    bindProfileTabs();
  }, 30);
}

function renderGuide() {
  openModal(`<button class="close-btn" id="closeModalBtn">×</button>
    <h2>📘 攻略</h2>
    ${profileTabsHtml('guide')}
    <p style="font-size:0.85rem; color:#2c6f85; line-height:1.7; margin-bottom:12px;">
      共 <strong>10 年</strong>（8岁 → 18岁），每年安排 <strong>春夏秋冬 4 次日程</strong>。
    </p>
    <h3>🎯 部分结局条件</h3>
    <ul class="guide-list">
      <li>📚 <strong>执笔为灯</strong>：文学达到5级</li>
      <li>🎵 <strong>琴键上的海</strong>：音乐达到5级</li>
      <li>🔬 <strong>深海的研究者</strong>：科学达到5级</li>
      <li>🎨 <strong>画海的人</strong>：美术达到5级</li>
      <li>🎀 <strong>优雅的守望者</strong>：礼仪达到5级</li>
      <li>🏅 <strong>追风的冠军</strong>：运动达到5级</li>
      <li>🔮 <strong>深海魔女</strong>：魔法路线达到6点</li>
      <li>👑 <strong>潮汐女王</strong>：王族≥5 且 魔法≥3</li>
      <li>✨ <strong>海之女神</strong>：神性路线达到6点</li>
      <li>🌌 <strong>双界的守望者</strong>：三条特殊路线都达到高值</li>
      <li>💞 <strong>血脉相连</strong>：羁绊≥85 且 心情≥75</li>
      <li>😊 <strong>海边的花匠</strong>：心情≥85 且 羁绊≥70</li>
      <li>🍃 <strong>细水长流</strong>：保底结局</li>
    </ul>
    <div class="flow-card" style="margin-top:14px;">
      💡 <strong>小提示</strong>：天赋课程效果×1.5。旅行商人每 3 年（第 3、6、9 年）来一次。心情低于 20 会扣羁绊，注意休息。
    </div>
  `);
  setTimeout(() => {
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
    bindProfileTabs();
  }, 30);
}

/* ==================== 模态框 ==================== */
function openModal(html) {
  if (!modalContent) return;
  modalContent.innerHTML = html;
  modalOverlay.classList.add('show');
  setTimeout(() => {
    document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
  }, 20);
}
function closeModal() { modalOverlay.classList.remove('show'); }

/* ==================== 成就检查 ==================== */
function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    try {
      if (!profile.totalAchievements.has(a.id) && a.cond(state, extraStats)) {
        profile.totalAchievements.add(a.id);
        saveProfile();
        showAchievementToast(a);
      }
    } catch(e) { console.warn('ach check fail', a.id, e); }
  });
}

/* ==================== 重新开始 ==================== */
function restartGame() {
  mainPanel.classList.add('hidden');
  showIntroStory();
}

/* ==================== 开场 ==================== */
function showIntroStory() {
  const introText = `潮汐镇，一个漂浮在海面上的小岛。

每隔十二年，潮汐信使会从深海里浮上来，把一个孩子送到镇上某户人家的门口。

这个孩子会在人间度过十年，从 8 岁长到 18 岁。然后，她要独自出海。

今天清晨，门外传来轻轻的敲门声。你打开门——一个女孩站在那里，手里攥着一枚贝壳。

"你……是我的家人吗？"`;

  const nameCards = Object.entries(DAUGHTER_PROFILES).map(([name, p]) => `
    <div class="name-card" data-name="${name}">
      <div class="em">${p.emoji}</div>
      <div class="nm">${name}</div>
      <div class="traits">${p.personality}<br>${p.hobby}</div>
      <div class="talent-tag">🌟 ${p.talent}</div>
    </div>
  `).join('');

  openModal(`
    <button class="close-btn" id="closeModalBtn" style="display:none;">×</button>
    <h2>🌊 潮汐的守望</h2>
    <div class="story-text">${introText}</div>
    <h3>① 给我取个名字吧</h3>
    <div class="form-row">
      <label>孩子叫什么？</label>
      <input type="text" id="customNameInput" placeholder="输入名字" maxlength="8" value="汐月">
    </div>
    <div class="form-row">
      <label>你希望她怎么称呼你？</label>
      <input type="text" id="playerTitleInput" placeholder="例如：妈妈、爹地、姐姐…" maxlength="6" value="妈妈">
    </div>
    <h3 style="margin-top:16px;">② 选择一个预设，或自定义</h3>
    <div class="name-grid" id="nameGrid">${nameCards}</div>
    <div style="text-align:center; margin: 4px 0 8px;">
      <button class="chip" id="customModeBtn" style="padding:8px 18px;">🎨 自定义孩子</button>
    </div>
    <div id="customPanel" class="hidden" style="background:#fff; border-radius:20px; padding:14px 16px; border:1.5px solid var(--sea-100);">
      <div class="form-row">
        <label>形象</label>
        <div class="chip-row" id="emojiRow">${EMOJI_OPTIONS.map(e => `<button class="chip" data-emoji="${e}">${e}</button>`).join('')}</div>
      </div>
      <div class="form-row">
        <label>性格</label>
        <div class="chip-row" id="personalityRow">${PERSONALITY_OPTIONS.map(p => `<button class="chip" data-personality="${p}">${p}</button>`).join('')}</div>
      </div>
      <div class="form-row">
        <label>兴趣</label>
        <div class="chip-row" id="hobbyRow">${HOBBY_OPTIONS.map(h => `<button class="chip" data-hobby="${h}">${h}</button>`).join('')}</div>
      </div>
      <div class="form-row">
        <label>天赋（对应课程效果×1.5）</label>
        <div class="chip-row" id="talentRow">${TALENT_OPTIONS.map(t => `<button class="chip" data-talent="${t.id}">${t.emoji} ${t.name}</button>`).join('')}</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn btn-primary" style="flex:1;" id="confirmNameBtn">🌱 开始养育</button>
    </div>
  `);

  setTimeout(() => {
    let selectedName = '汐月';
    let customMode = false;
    let customEmoji = '👧🏻';
    let customPersonality = '安静温柔';
    let customHobby = '看海·听浪';
    let customTalent = 'literature';

    const grid = document.getElementById('nameGrid');
    const customPanel = document.getElementById('customPanel');
    const customModeBtn = document.getElementById('customModeBtn');

    grid.querySelectorAll('.name-card').forEach(card => {
      card.addEventListener('click', () => {
        if (customMode) return;
        grid.querySelectorAll('.name-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedName = card.dataset.name;
        document.getElementById('customNameInput').value = selectedName;
      });
    });
    grid.querySelector('.name-card')?.classList.add('selected');

    customModeBtn.addEventListener('click', () => {
      customMode = !customMode;
      customPanel.classList.toggle('hidden', !customMode);
      customModeBtn.classList.toggle('selected', customMode);
      grid.querySelectorAll('.name-card').forEach(c => c.classList.remove('selected'));
    });

    function bindChipRow(rowId, dataKey, onChange) {
      document.querySelectorAll(`#${rowId} .chip`).forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll(`#${rowId} .chip`).forEach(x => x.classList.remove('selected'));
          c.classList.add('selected');
          onChange(c.dataset[dataKey]);
        });
      });
    }
    bindChipRow('emojiRow', 'emoji', v => customEmoji = v);
    bindChipRow('personalityRow', 'personality', v => customPersonality = v);
    bindChipRow('hobbyRow', 'hobby', v => customHobby = v);
    bindChipRow('talentRow', 'talent', v => customTalent = v);

    document.getElementById('confirmNameBtn')?.addEventListener('click', () => {
      const name = document.getElementById('customNameInput').value.trim() || '汐月';
      const playerTitle = document.getElementById('playerTitleInput').value.trim() || '妈妈';

      let childProfile;
      if (customMode) {
        const talentInfo = TALENT_OPTIONS.find(t => t.id === customTalent) || TALENT_OPTIONS[0];
        childProfile = {
          emoji: customEmoji, personality: customPersonality, hobby: customHobby,
          talent: talentInfo.name, talentBonus: customTalent,
          tags: [customPersonality, talentInfo.name],
          catchphrases: {
            happy: ['今天好开心！', '谢谢你！', '我觉得很幸福。'],
            normal: ['你在做什么呀？', '今天天气真好。', '我有点饿了。'],
            sad: ['……我不太开心。', '可以抱抱我吗？', '我想一个人待一会儿。'],
          }
        };
      } else {
        childProfile = DAUGHTER_PROFILES[selectedName] || DAUGHTER_PROFILES['汐月'];
      }

      startGame(name, playerTitle, childProfile);
    });
  }, 30);
}

/* ==================== 开始游戏 ==================== */
function startGame(name, playerTitle, childProfile) {
  state.name = name;
  state.playerTitle = playerTitle;
  state.profile = childProfile;

  state.intelligence = 0;
  state.charm = 0;
  state.stamina = 60;
  state.mood = 60;
  state.trust = 50;
  state.money = 0;
  state.age = 8; state.year = 1;
  state.schedule = { spring: null, summer: null, autumn: null, winter: null };
  state.skills = { literature: 0, music: 0, science: 0, art: 0, etiquette: 0, sports: 0 };
  state.choices = [];
  state.seenEvents = new Set();
  state.flags = {
    magiPath: 0, royalPath: 0, divinePath: 0, artistPath: 0,
    scholarPath: 0, kindness: 0, ambition: 0, empathy: 0, wisdom: 0, courage: 0,
  };
  state.focusMinutes = 25;
  state.lowMoodWarned = false;

  extraStats.focusCount = 0; extraStats.purchaseCount = 0; extraStats.eventsTriggered = 0;
  extraStats.totalFocusSeconds = 0; extraStats.choicesMade = 0; extraStats.letterRead = false;
  extraStats.merchantVisits = 0;

  state.memories = [];
  focusElapsedSec = 0;
  sessionRewarded = false;
  if (sessionGold) sessionGold.textContent = '0';
  if (totalGold) totalGold.textContent = '0';
  clearTimer();
  isTimerRunning = false;
  if (startPauseBtn) startPauseBtn.textContent = '▶ 开始专注';
  if (canvas) canvas.classList.remove('locked');

  closeModal();
  mainPanel.classList.remove('hidden');
  refreshDaughterAvatar();
  updateStatsUI();
  drawDisc();

  setTimeout(() => {
    setSpeech(`你好，我是${state.name}。\n从今天起，我们就是家人啦～`, 'happy');
    avatarAnimate('happy');
  }, 300);

  if (profile.kidsRaised.length === 0) {
    setTimeout(() => showTutorial(), 1200);
  }
}

/* ==================== 教程 ==================== */
function showTutorial() {
  openModal(`
    <button class="close-btn" id="closeModalBtn" style="display:none;">×</button>
    <h2>🌊 欢迎来到潮汐镇</h2>
    <div class="story-text">在开始之前，先了解一下：</div>
    <div class="tutorial-step">
      <div class="t-num">1</div>
      <div class="t-text"><strong>专注赚贝壳币</strong>：拖动圆环选择 5-60 分钟。1 分钟 = 1 币。专注同时恢复少量体力。</div>
    </div>
    <div class="tutorial-step">
      <div class="t-num">2</div>
      <div class="t-text"><strong>每年安排 4 次日程</strong>：春、夏、秋、冬各一次。点击"安排日程"进入日程界面。</div>
    </div>
    <div class="tutorial-step">
      <div class="t-num">3</div>
      <div class="t-text"><strong>共 10 年</strong>：从 8 岁到 18 岁。第 10 年冬结束，她会出海，走向属于她的结局。</div>
    </div>
    <div class="tutorial-step">
      <div class="t-num">4</div>
      <div class="t-text"><strong>属性</strong>：智力、魅力、体力、心情、羁绊。上课消耗体力、降低心情。心情低于 20 会掉羁绊！</div>
    </div>
    <div class="tutorial-step">
      <div class="t-num">5</div>
      <div class="t-text"><strong>旅行商人</strong>：第 3、6、9 年会来访，带来稀有物品。</div>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn btn-primary" style="flex:1;" id="tutorialDoneBtn">我明白了 →</button>
    </div>
  `);
  setTimeout(() => {
    document.getElementById('tutorialDoneBtn')?.addEventListener('click', () => {
      closeModal();
    });
  }, 30);
}

/* ==================== 事件绑定 ==================== */
function bindEvents() {
  startPauseBtn?.addEventListener('click', toggleTimer);
  resetTimerBtn?.addEventListener('click', resetTimer);
  document.getElementById('openScheduleBtn')?.addEventListener('click', openSchedule);
  profileBtn?.addEventListener('click', openProfile);

  daughterAvatar?.addEventListener('click', () => {
    const lines = state.mood >= 60
      ? ['嗯！', '嘿嘿～', '抱抱！', '你在忙吗？', '我最喜欢你了！']
      : ['……嗯。', `${state.playerTitle}……`, '我有点累。', '可以陪陪我吗？'];
    setSpeech(rand(lines), state.mood >= 60 ? 'happy' : 'sad', 2500);
    avatarAnimate(state.mood >= 60 ? 'happy' : 'sad');
  });

  modalOverlay?.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
  });
}

/* ==================== 启动 ==================== */
window.addEventListener('load', () => {
  cacheDom();
  loadProfile();
  mainPanel.classList.add('hidden');
  bindEvents();
  bindCanvas();
  drawDisc();
  showIntroStory();

  setInterval(() => {
    if (mainPanel.classList.contains('hidden')) return;
    const st = state.mood >= 80 ? '开心极了' : state.mood >= 60 ? '心情不错' : state.mood >= 40 ? '有点安静' : state.mood >= 20 ? '闷闷不乐' : '非常难过';
    if (!statusTag.classList.contains('show')) statusTag.textContent = st;
    if (state.stamina <= 20) daughterAvatar.classList.add('tired');
    else daughterAvatar.classList.remove('tired');
  }, 3000);
});

window.addEventListener('beforeunload', clearTimer);
</script>
</body>
</html>
